<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notes | V4JB</title>
  <meta name="description" content="atmosphere and texture">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Notes | V4JB">
  <meta property="og:description" content="atmosphere and texture">
  <meta property="og:url" content="https://iamtew.github.io/V4JB/notes.html">
  <meta property="og:image" content="https://iamtew.github.io/V4JB/ogimage-V4JB.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://iamtew.github.io/V4JB/ogimage-V4JB.png">
  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body data-note>
  <canvas id="fx" aria-hidden="true"></canvas>
  <header>
    <a class="brand" href="index.html"><img src="logo.png" alt="" width="36" height="36">V4JB</a>
    <nav>
      <a href="index.html#sound">Sound</a>
      <a href="notes.html?doc=MANUAL.md">Manual</a>
      <a href="index.html#notes">Notes</a>
      <a href="https://audio.stupid.systems/">Stupid Audio</a>
    </nav>
  </header>

  <main>
    <p class="meta"><a href="index.html#notes">← Notes</a></p>
    <article id="md" class="md card"></article>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked@15/marked.min.js"></script>
  <script type="module" src="fx.js"></script>
  <script src="site.js"></script>
  <script>
    // Allowlist: only these files can be fetched via ?doc=.
    const allow = {
      "MANUAL.md": "Manual",
      "PRD.md": "Brief",
      "ARCHITECTURE.md": "Architecture",
      "DSP_NOTES.md": "DSP notes"
    };
    const file = new URLSearchParams(location.search).get("doc");
    const doc = allow[file] ? file : "PRD.md";
    document.title = allow[doc] + " | V4JB";
    fetch(doc)
      .then((r) => r.ok ? r.text() : Promise.reject())
      .then((t) => {
        const md = document.getElementById("md");
        md.innerHTML = marked.parse(t);
        md.querySelectorAll("h1, h2, h3").forEach((h) => {
          if (!h.id)
            h.id = h.textContent.trim().toLowerCase().replace(/[^\w]+/g, "-").replace(/^-|-$/g, "");
        });
        if (location.hash)
          document.getElementById(location.hash.slice(1))?.scrollIntoView();
      })
      .catch(() => { document.getElementById("md").textContent = "Could not load that note."; });
  </script>
</body>
</html>
